# Every push builds the APK and puts it on the Releases page, so it can be downloaded straight to the phone.
# It's signed with the same key as the PC builds (kept as the KEYSTORE_B64 secret), so it installs over the old app.
# Free on public repos; switch it off any time under the repo's Actions tab.
name: Build APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:        # plus a "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          test -s "$RUNNER_TEMP/debug.keystore"
      - name: Build
        # Signed with the PC's own debug key (standard Android debug passwords), so it updates the installed app.
        run: >
          bash ./gradlew assembleDebug --no-daemon
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/debug.keystore"
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=androiddebugkey
          -Pandroid.injected.signing.key.password=android
      - name: Check it's signed with the same key as the installed app
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$("$SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256' | awk '{print $NF}')
          echo "signed with $GOT"
          test "$GOT" = "f90b07c9b32a21f52b30d87a1a41f560dcad9aa0a2e3346e778d0566c411d1d9"
      - name: Put it on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ vars.APK_NAME }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK_NAME" --title "Version $VER" --notes "Built from $(git rev-parse --short HEAD). Download $APK_NAME on the phone and install it over the old app."
